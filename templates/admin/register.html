<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
  <title>Register Admin</title>

  <!-- General CSS Files -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/fontawesome/css/all.min.css') }}">

  <!-- CSS Libraries -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/jquery-selectric/selectric.css') }}">

  <!-- Template CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/css/components.css') }}">
</head>

<body>
<div id="app">
  <section class="section">
    <div class="container mt-5">
      <div class="row">
        <div class="col-12 col-sm-8 offset-sm-2 col-md-6 offset-md-3">
          <div class="login-brand">
            <img src="{{ url_for('static', filename='img/logo.png') }}"
                 alt="logo"
                 width="100"
                 class="shadow-light rounded-circle">
            <h2 class="mt-3 text-center">SISTEM REKOMENDASI<br>PEMILIHAN BUKU REMAJA</h2>
          </div>
            <div class="card card-primary">
            <div class="card-header">
              <h4>Admin Register</h4>
            </div>

            <div class="card-body">
              # FLASH MESSAGE
              {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                      {% for category, message in messages %}
                          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                              {{ message }}
                              <button type="button"
                                      class="close"
                                      data-dismiss="alert">
                                  <span>&times;</span>
                              </button>
                          </div>
                      {% endfor %}
                  {% endif %}
              {% endwith %}

              # FORM 
              <form method="POST"
                    action="{{ url_for('register') }}">
                <div class="form-group">
                  <label>Username</label>
                  <input type="text"
                         class="form-control"
                         name="nama_lengkap"
                         value="{{ request.form.nama_lengkap }}"
                         required>
                </div>
                <div class="form-group">
                  <label>Email</label>
                  <input type="email"
                         class="form-control"
                         name="email"
                         value="{{ request.form.email }}"
                         required>
                </div>
                <div class="row">
                  <div class="form-group col-6">
                    <label>Password</label>
                    <input type="password"
                           class="form-control"
                           name="password"
                           required>
                  </div>
                  <div class="form-group col-6">
                    <label>Password Confirmation</label>
                    <input type="password"
                           class="form-control"
                           name="password_confirm"
                           required>
                  </div>
                </div>
                <div class="form-group">
                  <button type="submit" class="btn btn-primary btn-lg btn-block"> Register</button>
                </div>
              </form>
                <div class="text-center"> Sudah punya akun?
                <a href="{{ url_for('login') }}"> Login </a>
                <br>
                <a href="{{ url_for('index') }}"><i class="fas fa-home"></i>Kembali ke Beranda</a>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- JS -->
<script src="{{ url_for('static', filename='admin/assets/modules/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='admin/assets/modules/popper.js') }}"></script>
<script src="{{ url_for('static', filename='admin/assets/modules/bootstrap/js/bootstrap.min.js') }}"></script>
<script src="{{ url_for('static', filename='admin/assets/js/stisla.js') }}"></script>
<script src="{{ url_for('static', filename='admin/assets/js/scripts.js') }}"></script>
<script src="{{ url_for('static', filename='admin/assets/js/custom.js') }}"></script>

</body>
</html>
