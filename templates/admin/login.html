<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
  <title>Login Admin</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/fontawesome/css/all.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/css/components.css') }}">
</head>

<body>
<div id="app">
  <section class="section">
    <div class="container mt-5">
      <div class="row">
        <div class="col-12 col-sm-8 offset-sm-2 col-md-6 offset-md-3">

          <div class="login-brand">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="logo" width="100" class="shadow-light rounded-circle">
            <h2 class="mt-3">Sistem Rekomendasi Pemilihan Buku Remaja</h2>
          </div>

          <div class="card card-primary">
            <div class="card-header">
              <h4>Login Admin</h4>
            </div>

            <div class="card-body">

              {% with messages = get_flashed_messages() %}
                {% if messages %}
                  {% for message in messages %}
                    <div class="alert alert-danger">
                      {{ message }}
                    </div>
                  {% endfor %}
                {% endif %}
              {% endwith %}

              <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">
                  <label>Email</label>
                  <input type="email"
                         name="email"
                         class="form-control"
                         required>
                </div>

                <div class="form-group">
                  <label>Password</label>
                  <input type="password"
                         name="password"
                         class="form-control"
                         required>
                </div>

                <div class="form-group">
                  <button type="submit"
                          class="btn btn-primary btn-lg btn-block">
                    Login
                  </button>
                </div>
              <div class="text-center mt-3">
                <a href="{{ url_for('index') }}">
                    <i class="fas fa-home"></i>
                    Kembali ke Beranda
                </a></div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<script src="{{ url_for('static', filename='admin/assets/modules/jquery.min.js') }}"></script>
<script src="{{ url_for('static', filename='admin/assets/modules/bootstrap/js/bootstrap.min.js') }}"></script>
</body>
</html>
