<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" name="viewport">
  <title>Sistem Rekomendasi Pemilihan Buku Remaja &mdash; Admin</title>

  <!-- General CSS Files -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/bootstrap/css/bootstrap.min.css')}}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/fontawesome/css/all.min.css')}}">

  <!-- CSS Libraries -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/jqvmap/dist/jqvmap.min.css')}}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/weather-icon/css/weather-icons.min.css')}}">

  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/modules/summernote/summernote-bs4.css')}}">

  <!-- Template CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/css/style.css')}}">
  <link rel="stylesheet" href="{{ url_for('static', filename='admin/assets/css/components.css')}}">
</head>

<body>
  <div id="app">
    <div class="main-wrapper main-wrapper-1">
      <div class="navbar-bg"></div>
      <nav class="navbar navbar-expand-lg main-navbar">
        <form class="form-inline mr-auto">
          <ul class="navbar-nav mr-3">
            <li><a href="#" data-toggle="sidebar" class="nav-link nav-link-lg"><i class="fas fa-bars"></i></a></li>
          </ul>
        </form>
        <ul class="navbar-nav navbar-right">
          <li class="dropdown"><a href="#" data-toggle="dropdown" class="nav-link dropdown-toggle nav-link-lg nav-link-user">
            <div class="d-sm-none d-lg-inline-block"> {{ session.get('nama_admin', 'Admin') }}</div></a>
            <div class="dropdown-menu dropdown-menu-right">
              <a href="{{ url_for('logout') }}" class="dropdown-item has-icon text-danger">
                <i class="fas fa-sign-out-alt"></i> Logout
              </a>
            </div>
          </li>
        </ul>
      </nav>
      <div class="main-sidebar sidebar-style-2">
        <aside id="sidebar-wrapper">
          <div class="sidebar-brand">
            <a href="{{ url_for('dashboard') }}">ADMIN</a>
          </div>
          <ul class="sidebar-menu">
            <li class="menu-header">Admin</li>
            <li><a class="nav-link" href="{{ url_for('dashboard') }}"><i class="fas fa-fire"></i> <span>Dashboard</span></a></li>
            <li class="menu-header">Data</li>
            <li><a class="nav-link" href="{{ url_for('data_buku') }}"><i class="fas fa-columns"></i> <span>Data Buku</span></a></li>
            <li><a class="nav-link" href="{{ url_for('kategori_buku') }}"><i class="far fa-square"></i> <span>Kategori Buku</span></a></li>
            <li><a class="nav-link" href="{{ url_for('daftar_admin') }}"><i class="far fa-user"></i> <span>Daftar Admin</span></a></li>
            <li><a class="nav-link" href="{{ url_for('riwayat_perhitungan') }}"><i class="far fa-file-alt"></i> <span>Riwayat Perhitungan</span></a></li>
            </ul>
        </aside>
      </div>
      <div class="main-content">
        {% block content %}
        {% endblock %}
      </div>

      <footer class="main-footer">
        <div class="footer-left">
          &copy; 2026 <div class="bullet"></div> By <a href="#">Afira Chrislince Pasha</a>
        </div>
      </footer>
    </div>
  </div>

  <!-- General JS Scripts -->
  <script src="{{ url_for('static', filename='admin/assets/modules/jquery.min.js')}}"></script>
  <script src="{{ url_for('static', filename='admin/assets/modules/popper.js')}}"></script>
  <script src="{{ url_for('static', filename='admin/assets/modules/tooltip.js')}}"></script>
  <script src="{{ url_for('static', filename='admin/assets/modules/bootstrap/js/bootstrap.min.js')}}"></script>
  <script src="{{ url_for('static', filename='admin/assets/modules/nicescroll/jquery.nicescroll.min.js')}}"></script>
  <script src="{{ url_for('static', filename='admin/assets/modules/moment.min.js')}}"></script>
  <script src="{{ url_for('static', filename='admin/assets/js/stisla.js')}}"></script>

  <script src="{{ url_for('static', filename='admin/assets/js/scripts.js')}}"></script>
  <script src="{{ url_for('static', filename='admin/assets/js/custom.js')}}"></script>
